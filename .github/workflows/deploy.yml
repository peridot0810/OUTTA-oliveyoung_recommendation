name: Deploy To EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Github Repository 파일 불러오기
        uses: actions/checkout@v4

      - name: Python 3.10 설치
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'


      - name: AWS Resource에 접근할 수 있게 AWS credentials 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: ECR에 로그인하기
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: Docker 이미지 생성
        run: docker build -t oliveyoung-cream-recommendation-server .

      - name: Docker 이미지에 Tag 붙이기
        run: docker tag oliveyoung-cream-recommendation-server ${{ steps.login-ecr.outputs.registry }}/oliveyoung-cream-recommendation-server:latest

      - name: ECR에 Docker 이미지 Push하기
        run: docker push ${{ steps.login-ecr.outputs.registry }}/oliveyoung-cream-recommendation-server:latest

      - name: SSH로 EC2에 접속하기
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true
          script: |
            # ECR 로그인
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            
            # 기존 컨테이너 정리
            docker stop oliveyoung-cream-recommendation-server || true
            docker rm oliveyoung-cream-recommendation-server || true
            
            # 새 이미지 pull 및 실행
            docker pull ${{ steps.login-ecr.outputs.registry }}/oliveyoung-cream-recommendation-server:latest
            docker run -d --name oliveyoung-cream-recommendation-server -p 5000:5000 ${{ steps.login-ecr.outputs.registry }}/oliveyoung-cream-recommendation-server:latest